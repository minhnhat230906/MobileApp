<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao diện iPhone 13 - Profile</title>
    <link rel="stylesheet" href="style.css">
    <!-- Thêm icon từ FontAwesome để hiển thị nút mũi tên và nút sửa -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Khung mô phỏng điện thoại iPhone 13 -->
    <div class="iphone-13-frame">
        <!-- Phần tai thỏ (Notch) đặc trưng của iPhone 13 -->
        <div class="notch"></div>

        <!-- Màn hình bên trong điện thoại -->
        <div class="screen">
            <!-- Thanh Header chứa nút quay lại và nút chỉnh sửa -->
            <div class="header">
                <button class="icon-btn"><i class="fa-solid fa-arrow-left"></i></button>
                <button class="icon-btn"><i class="fa-solid fa-pen-to-square"></i></button>
            </div>

            <!-- Nội dung chính: Ảnh đại diện, Tên, MSSV -->
            <div class="profile-content">
                <div class="avatar-container">
                    <!-- Đảm bảo file avatar.jpg đã có trong thư mục của bạn -->
                    <img src="avatar.png" alt="Ảnh cá nhân" class="avatar">
                </div>
                <!-- HỌ VÀ TÊN CỦA BẠN -->
                <h2 class="name">Lê Hoàng Minh Nhật</h2>
                <!-- MÃ SỐ SINH VIÊN CỦA BẠN -->
                <p class="mssv">MSSV: 067206003243</p>
            </div>
        </div>
    </div>

</body>
</html>
