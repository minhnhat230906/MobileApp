<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xếp loại học lực</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Khung mô phỏng điện thoại iPhone 13 -->
    <div class="iphone-13-frame">
        <div class="notch"></div>

        <div class="screen">
            <!-- Header ứng dụng -->
            <div class="header">
                <h3>Xếp loại học lực</h3>
            </div>

            <!-- Vùng hiển thị điểm chính (8.5) -->
            <div class="card main-grade-card">
                <span class="label">Điểm trung bình</span>
                <h1 id="main-score">8.5</h1>
                <div id="main-badge" class="badge">Giỏi</div>
            </div>

            <!-- Vùng kiểm tra thêm các mốc điểm khác -->
            <div class="section-title">KIỂM TRA THÊM</div>
            <div class="card test-list-card">
                <div id="test-list-container">
                    <!-- JavaScript sẽ tự động render các dòng kiểm tra thêm vào đây -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
